spring.application.name=CollabDoc

# OpenGauss Database
spring.datasource.url=jdbc:opengauss://localhost:5432/homework
spring.datasource.username=homework
spring.datasource.password=Homework@123
spring.datasource.driver-class-name=org.opengauss.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect.use_get_generated_keys=false

# Hibernate Lazy Loading
spring.jpa.open-in-view=false
spring.jackson.serialization.fail-on-empty-beans=false

# JWT
jwt.secret=CollabDocSecretKey2024VeryLongSecretKeyForHS256Algorithm
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
